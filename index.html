<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión - Taller Moto Mapache</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fffbe1',
                            100: '#fff6b8',
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                            900: '#78350f',
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_URL = 'http://localhost:3000/api';

        // DATOS INICIALES DE RESPALDO (EN CASO DE PROBAR SIN BACKEND)
        const initialClientes = [
            { dpi: '1901234560901', nombre: 'Carlos', apellido: 'Mendoza', telefono: '5551-2345', email: 'carlos@gmail.com', direccion: 'Zona 1, Quetzaltenango' },
            { dpi: '2010987650901', nombre: 'Ana', apellido: 'Gómez', telefono: '5558-7654', email: 'ana.gomez@gmail.com', direccion: 'Zona 3, Quetzaltenango' }
        ];

        const initialMotocicletas = [
            { id: 1, clienteDpi: '1901234560901', placa: 'M-123ABC', marca: 'Yamaha', modelo: 'FZ 25', anio: 2022, color: 'Negro' },
            { id: 2, clienteDpi: '2010987650901', placa: 'M-987XYZ', marca: 'Honda', modelo: 'Navi 110', anio: 2021, color: 'Rojo' }
        ];

        const initialRepuestos = [
            { id: 1, nombreRepuesto: 'Aceite Yamalube 20W50', marca: 'Yamalube', precioVenta: 65.00, existencia: 20, stockMinimo: 5 },
            { id: 2, nombreRepuesto: 'Pastillas de Freno Delanteras', marca: 'Yamaha', precioVenta: 120.00, existencia: 8, stockMinimo: 5 },
            { id: 3, nombreRepuesto: 'Filtro de Aire OEM', marca: 'Honda', precioVenta: 45.00, existencia: 15, stockMinimo: 4 },
            { id: 4, nombreRepuesto: 'Bujía NGK C7HSA', marca: 'NGK', precioVenta: 25.00, existencia: 30, stockMinimo: 10 }
        ];

        const initialServicios = [
            { id: 1, nombre: 'Cambio de Aceite y Filtro', precio: 75.00, descripcion: 'Cambio de lubricante motor y filtro primario' },
            { id: 2, nombre: 'Revisión y Ajuste de Frenos', precio: 100.00, descripcion: 'Ajuste de tambores y limpieza de pastillas' },
            { id: 3, nombre: 'Alineación y Balanceo', precio: 85.00, descripcion: 'Balanceo dinámico de aros y tensión de chasis' },
            { id: 4, nombre: 'Servicio Mayor Completo', precio: 350.00, descripcion: 'Mantenimiento integral de motor, frenos y transmisión' }
        ];

        const initialMecanicos = [
            { id: 1, nombre: 'Juan', apellido: 'Pérez', especialidad: 'Sistemas Eléctricos y Motor' },
            { id: 2, nombre: 'Luis', apellido: 'Ramírez', especialidad: 'Frenos y Mantenimiento' }
        ];

        const initialUsuarios = [
            { id: 1, username: 'jefe_admin', nombre: 'Jefe Taller', rol: 'Jefe', rolId: 1, mecanicoId: null },
            { id: 2, username: 'recepcion1', nombre: 'Recepcionista', rol: 'Recepcionista', rolId: 2, mecanicoId: null },
            { id: 3, username: 'mecanico_juan', nombre: 'Juan Pérez', rol: 'Mecanico', rolId: 3, mecanicoId: 1 },
            { id: 4, username: 'mecanico_luis', nombre: 'Luis Ramírez', rol: 'Mecanico', rolId: 3, mecanicoId: 2 }
        ];

        const initialOrdenes = [
            { id: 1, motocicletaId: 1, mecanicoId: 1, fechaIngreso: '2026-03-01 09:00', fechaEntrega: null, problemaReportado: 'Ruido al frenar y cambio de aceite', diagnostico: 'Pastillas desgastadas al 80%', estado: 'En Proceso', servicios: [{ id: 1, nombre: 'Cambio de Aceite', precio: 75.00 }], costoTotal: 140.00 },
            { id: 2, motocicletaId: 2, mecanicoId: 2, fechaIngreso: '2026-03-01 10:30', fechaEntrega: null, problemaReportado: 'Ajuste general de frenos traseros', diagnostico: 'Calibración requerida', estado: 'Pendiente', servicios: [{ id: 2, nombre: 'Ajuste de Frenos', precio: 100.00 }], costoTotal: 100.00 }
        ];

        const initialMovimientos = [
            { id: 1, repuestoNombre: 'Aceite Yamalube 20W50', tipo: 'Entrada', cantidad: 20, usuario: 'jefe_admin', fechaHora: '2026-03-01 08:00', descripcion: 'Carga inicial' },
            { id: 2, repuestoNombre: 'Pastillas de Freno', tipo: 'Entrada', cantidad: 10, usuario: 'recepcion1', fechaHora: '2026-03-01 08:30', descripcion: 'Reabastecimiento' }
        ];

        function App() {
            const [currentUser, setCurrentUser] = useState(null);
            const [loginUsername, setLoginUsername] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [loginError, setLoginError] = useState('');

            const [activeTab, setActiveTab] = useState('dashboard');
            const [otrosSubTab, setOtrosSubTab] = useState('vista_ordenes_pendientes');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            // ESTADOS DE LA APLICACIÓN
            const [clientes, setClientes] = useState(initialClientes);
            const [motocicletas, setMotocicletas] = useState(initialMotocicletas);
            const [repuestos, setRepuestos] = useState(initialRepuestos);
            const [servicios, setServicios] = useState(initialServicios);
            const [mecanicos, setMecanicos] = useState(initialMecanicos);
            const [usuarios, setUsuarios] = useState(initialUsuarios);
            const [ordenes, setOrdenes] = useState(initialOrdenes);
            const [movimientos, setMovimientos] = useState(initialMovimientos);

            // FORMULARIOS DE REGISTRO
            const [editingCliente, setEditingCliente] = useState(null);
            const [editingServicio, setEditingServicio] = useState(null);

            // FORMULARIO NUEVO USUARIO
            const [nuevoUserUsername, setNuevoUserUsername] = useState('');
            const [nuevoUserPassword, setNuevoUserPassword] = useState('');
            const [nuevoUserRolId, setNuevoUserRolId] = useState('2');
            const [nuevoUserMecanicoId, setNuevoUserMecanicoId] = useState('');

            // FORMULARIO NUEVO SERVICIO
            const [nuevoServNombre, setNuevoServNombre] = useState('');
            const [nuevoServDesc, setNuevoServDesc] = useState('');
            const [nuevoServPrecio, setNuevoServPrecio] = useState('');

            const [nuevoClienteDpi, setNuevoClienteDpi] = useState('');
            const [nuevoClienteNombre, setNuevoClienteNombre] = useState('');
            const [nuevoClienteApellido, setNuevoClienteApellido] = useState('');
            const [nuevoClienteTel, setNuevoClienteTel] = useState('');
            const [nuevoClienteEmail, setNuevoClienteEmail] = useState('');
            const [nuevoClienteDir, setNuevoClienteDir] = useState('');

            const [nuevaPlaca, setNuevaPlaca] = useState('');
            const [nuevaMarca, setNuevaMarca] = useState('');
            const [nuevoModelo, setNuevoModelo] = useState('');
            const [nuevoAnio, setNuevoAnio] = useState('2023');
            const [nuevoColor, setNuevoColor] = useState('');

            // CREACIÓN DE ÓRDENES
            const [ordenClienteDpi, setOrdenClienteDpi] = useState('1901234560901');
            const [ordenMotoId, setOrdenMotoId] = useState('1');
            const [ordenMecanicoId, setOrdenMecanicoId] = useState('1');
            const [ordenFalla, setOrdenFalla] = useState('');
            const [ordenServiciosSeleccionados, setOrdenServiciosSeleccionados] = useState([]);
            const [ordenMensajeExito, setOrdenMensajeExito] = useState('');

            // MODALES DE INVENTARIO
            const [showStockModal, setShowStockModal] = useState(false);
            const [selectedRepuestoId, setSelectedRepuestoId] = useState('1');
            const [stockCantidad, setStockCantidad] = useState(5);
            const [stockNota, setStockNota] = useState('Reabastecimiento de proveedor');

            const [showNewProductModal, setShowNewProductModal] = useState(false);
            const [nuevoProdNombre, setNuevoProdNombre] = useState('');
            const [nuevoProdMarca, setNuevoProdMarca] = useState('');
            const [nuevoProdPrecio, setNuevoProdPrecio] = useState('');
            const [nuevoProdExistencia, setNuevoProdExistencia] = useState('');
            const [nuevoProdStockMin, setNuevoProdStockMin] = useState('5');

            // CARGAR DATOS EN TIEMPO REAL SI EL BACKEND ESTÁ ENCENDIDO
            const cargarDatosDesdeMySQL = async () => {
                try {
                    const resClientes = await fetch(`${API_URL}/clientes`);
                    if (resClientes.ok) setClientes(await resClientes.json());

                    const resMotos = await fetch(`${API_URL}/motocicletas`);
                    if (resMotos.ok) setMotocicletas(await resMotos.json());

                    const resRepuestos = await fetch(`${API_URL}/repuestos`);
                    if (resRepuestos.ok) setRepuestos(await resRepuestos.json());

                    const resServicios = await fetch(`${API_URL}/servicios`);
                    if (resServicios.ok) setServicios(await resServicios.json());

                    const resUsuarios = await fetch(`${API_URL}/usuarios`);
                    if (resUsuarios.ok) setUsuarios(await resUsuarios.json());
                } catch (err) {
                    console.log("Servidor Backend desactivado. Usando almacenamiento en memoria.");
                }
            };

            useEffect(() => {
                if (currentUser) {
                    cargarDatosDesdeMySQL();
                }
            }, [currentUser]);

            // GESTIÓN DE USUARIOS
            const handleCrearUsuario = async (e) => {
                e.preventDefault();
                if (!nuevoUserUsername || !nuevoUserPassword) return;

                const rolNombre = nuevoUserRolId === '1' ? 'Jefe' : nuevoUserRolId === '2' ? 'Recepcionista' : 'Mecanico';
                const mecObj = mecanicos.find(m => m.id === parseInt(nuevoUserMecanicoId));

                try {
                    await fetch(`${API_URL}/usuarios`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: nuevoUserUsername,
                            password: nuevoUserPassword,
                            rol_id: parseInt(nuevoUserRolId),
                            mecanico_id: nuevoUserMecanicoId ? parseInt(nuevoUserMecanicoId) : null
                        })
                    });
                    cargarDatosDesdeMySQL();
                } catch (err) {
                    setUsuarios([...usuarios, {
                        id: usuarios.length + 1,
                        username: nuevoUserUsername,
                        nombre: mecObj ? `${mecObj.nombre} ${mecObj.apellido}` : nuevoUserUsername,
                        rol: rolNombre,
                        rolId: parseInt(nuevoUserRolId),
                        mecanicoId: nuevoUserMecanicoId ? parseInt(nuevoUserMecanicoId) : null
                    }]);
                }

                alert('Usuario creado correctamente');
                setNuevoUserUsername('');
                setNuevoUserPassword('');
                setNuevoUserMecanicoId('');
            };

            const handleEliminarUsuario = (userId) => {
                if (window.confirm('¿Está seguro de eliminar este usuario?')) {
                    setUsuarios(prev => prev.filter(u => u.id !== userId && u.usuario_id !== userId));
                }
            };

            // GESTIÓN DE SERVICIOS
            const handleCrearServicio = async (e) => {
                e.preventDefault();
                const precio = parseFloat(nuevoServPrecio);
                if (!nuevoServNombre || isNaN(precio)) return;

                try {
                    await fetch(`${API_URL}/servicios`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            nombre_servicio: nuevoServNombre,
                            descripcion: nuevoServDesc,
                            precio_base: precio
                        })
                    });
                    cargarDatosDesdeMySQL();
                } catch (err) {
                    setServicios([...servicios, {
                        id: servicios.length + 1,
                        nombre: nuevoServNombre,
                        descripcion: nuevoServDesc,
                        precio: precio
                    }]);
                }

                alert('Servicio agregado correctamente');
                setNuevoServNombre('');
                setNuevoServDesc('');
                setNuevoServPrecio('');
            };

            const handleActualizarServicio = (e) => {
                e.preventDefault();
                setServicios(prev => prev.map(s => (s.id === editingServicio.id || s.servicio_id === editingServicio.servicio_id) ? editingServicio : s));
                setEditingServicio(null);
            };

            const handleEliminarServicio = (servId) => {
                if (window.confirm('¿Está seguro de eliminar este servicio?')) {
                    setServicios(prev => prev.filter(s => s.id !== servId && s.servicio_id !== servId));
                }
            };

            // MANEJO DE LOGIN
            const handleLogin = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch(`${API_URL}/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: loginUsername, password: loginPassword })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setCurrentUser(data.user);
                        setLoginError('');
                        setLoginUsername('');
                        setLoginPassword('');
                        if (data.user.rol.toLowerCase() === 'jefe') setActiveTab('dashboard');
                        else if (data.user.rol.toLowerCase() === 'recepcionista') setActiveTab('recepcion_ordenes');
                        else setActiveTab('mecanico_trabajos');
                        return;
                    }
                } catch (err) {
                    // Fallback local
                    if (loginUsername === 'jefe_admin' && loginPassword === '123') {
                        setCurrentUser({ username: 'jefe_admin', nombre: 'Jefe Taller', rol: 'jefe' });
                        setActiveTab('dashboard');
                    } else if (loginUsername === 'recepcion1' && loginPassword === '123') {
                        setCurrentUser({ username: 'recepcion1', nombre: 'Recepcionista', rol: 'recepcionista' });
                        setActiveTab('recepcion_ordenes');
                    } else if (loginUsername === 'mecanico_juan' && loginPassword === '123') {
                        setCurrentUser({ username: 'mecanico_juan', nombre: 'Juan Pérez', rol: 'mecanico', mecanicoId: 1 });
                        setActiveTab('mecanico_trabajos');
                    } else if (loginUsername === 'mecanico_luis' && loginPassword === '123') {
                        setCurrentUser({ username: 'mecanico_luis', nombre: 'Luis Ramírez', rol: 'mecanico', mecanicoId: 2 });
                        setActiveTab('mecanico_trabajos');
                    } else {
                        setLoginError('Usuario o contraseña incorrectos.');
                        return;
                    }
                    setLoginError('');
                    setLoginUsername('');
                    setLoginPassword('');
                }
            };

            // REGISTRAR CLIENTE Y MOTOCICLETA
            const handleGuardarClienteYMoto = async (e) => {
                e.preventDefault();
                if (!nuevoClienteDpi || nuevoClienteDpi.length !== 13) {
                    alert('El DPI debe contener exactamente 13 dígitos numéricos.');
                    return;
                }

                try {
                    await fetch(`${API_URL}/clientes`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            dpi: nuevoClienteDpi,
                            nombre: nuevoClienteNombre,
                            apellido: nuevoClienteApellido,
                            telefono: nuevoClienteTel,
                            email: nuevoClienteEmail,
                            direccion: nuevoClienteDir
                        })
                    });

                    if (nuevaPlaca) {
                        await fetch(`${API_URL}/motocicletas`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                cliente_dpi: nuevoClienteDpi,
                                placa: nuevaPlaca.toUpperCase(),
                                marca: nuevaMarca,
                                modelo: nuevoModelo,
                                anio: parseInt(nuevoAnio),
                                color: nuevoColor
                            })
                        });
                    }
                    cargarDatosDesdeMySQL();
                } catch (err) {
                    const existe = clientes.some(c => c.dpi === nuevoClienteDpi);
                    if (!existe) {
                        setClientes([...clientes, { dpi: nuevoClienteDpi, nombre: nuevoClienteNombre, apellido: nuevoClienteApellido, telefono: nuevoClienteTel, email: nuevoClienteEmail, direccion: nuevoClienteDir }]);
                    }
                    if (nuevaPlaca) {
                        setMotocicletas([...motocicletas, { id: motocicletas.length + 1, clienteDpi: nuevoClienteDpi, placa: nuevaPlaca.toUpperCase(), marca: nuevaMarca, modelo: nuevoModelo, anio: parseInt(nuevoAnio), color: nuevoColor }]);
                    }
                }

                alert('Cliente y Motocicleta registrados correctamente.');
                setNuevoClienteDpi('');
                setNuevoClienteNombre('');
                setNuevoClienteApellido('');
                setNuevoClienteTel('');
                setNuevoClienteEmail('');
                setNuevoClienteDir('');
                setNuevaPlaca('');
                setNuevaMarca('');
                setNuevoModelo('');
                setNuevoColor('');
            };

            const handleActualizarCliente = (e) => {
                e.preventDefault();
                setClientes(prev => prev.map(c => c.dpi === editingCliente.dpi ? editingCliente : c));
                setEditingCliente(null);
            };

            const handleEliminarCliente = (dpiTarget) => {
                if (window.confirm(`¿Está seguro de eliminar al cliente con DPI ${dpiTarget}?`)) {
                    setClientes(prev => prev.filter(c => c.dpi !== dpiTarget));
                    setMotocicletas(prev => prev.filter(m => m.clienteDpi !== dpiTarget));
                }
            };

            const handleEliminarMoto = (motoId) => {
                if (window.confirm('¿Está seguro de eliminar esta motocicleta?')) {
                    setMotocicletas(prev => prev.filter(m => m.id !== motoId));
                }
            };

            const handleToggleServicioOrden = (servicio) => {
                const existe = ordenServiciosSeleccionados.some(s => s.id === servicio.id);
                if (existe) {
                    setOrdenServiciosSeleccionados(ordenServiciosSeleccionados.filter(s => s.id !== servicio.id));
                } else {
                    setOrdenServiciosSeleccionados([...ordenServiciosSeleccionados, servicio]);
                }
            };

            const handleCrearOrdenTrabajo = (e) => {
                e.preventDefault();
                if (!ordenFalla.trim()) {
                    alert('Debe ingresar la falla o problema reportado.');
                    return;
                }

                const costoServicios = ordenServiciosSeleccionados.reduce((acc, s) => acc + s.precio, 0);
                const nuevaOrden = {
                    id: ordenes.length + 1,
                    motocicletaId: parseInt(ordenMotoId),
                    mecanicoId: parseInt(ordenMecanicoId),
                    fechaIngreso: new Date().toLocaleString(),
                    fechaEntrega: null,
                    problemaReportado: ordenFalla,
                    diagnostico: 'Pendiente de diagnóstico inicial.',
                    estado: 'Pendiente',
                    servicios: ordenServiciosSeleccionados,
                    repuestos: [],
                    costoTotal: costoServicios,
                    saldoPendiente: costoServicios
                };

                setOrdenes([nuevaOrden, ...ordenes]);
                setOrdenMensajeExito(`¡Órden de Trabajo #${nuevaOrden.id} generada exitosamente!`);
                setOrdenFalla('');
                setOrdenServiciosSeleccionados([]);
                setTimeout(() => setOrdenMensajeExito(''), 4000);
            };

            const handleAgregarStock = (e) => {
                e.preventDefault();
                const repuestoId = parseInt(selectedRepuestoId);
                const cant = parseInt(stockCantidad);

                setRepuestos(prev => prev.map(r => r.id === repuestoId ? { ...r, existencia: r.existencia + cant } : r));
                const rep = repuestos.find(r => r.id === repuestoId);

                const newMov = {
                    id: movimientos.length + 1,
                    repuestoNombre: rep?.nombreRepuesto || 'Repuesto',
                    tipo: 'Entrada',
                    cantidad: cant,
                    usuario: currentUser.username,
                    fechaHora: new Date().toLocaleString(),
                    descripcion: stockNota
                };

                setMovimientos([newMov, ...movimientos]);
                setShowStockModal(false);
                setStockCantidad(5);
                setStockNota('Reabastecimiento de proveedor');
            };

            const handleCrearNuevoProducto = (e) => {
                e.preventDefault();
                const newId = repuestos.length + 1;
                const cantInicial = parseInt(nuevoProdExistencia) || 0;
                const precio = parseFloat(nuevoProdPrecio) || 0.0;
                const stockMin = parseInt(nuevoProdStockMin) || 5;

                const newRepuesto = {
                    id: newId,
                    nombreRepuesto: nuevoProdNombre,
                    marca: nuevoProdMarca,
                    precioVenta: precio,
                    existencia: cantInicial,
                    stockMinimo: stockMin
                };

                setRepuestos([...repuestos, newRepuesto]);

                if (cantInicial > 0) {
                    const newMov = {
                        id: movimientos.length + 1,
                        repuestoNombre: nuevoProdNombre,
                        tipo: 'Entrada',
                        cantidad: cantInicial,
                        usuario: currentUser.username,
                        fechaHora: new Date().toLocaleString(),
                        descripcion: 'Creación de nuevo repuesto en catálogo'
                    };
                    setMovimientos([newMov, ...movimientos]);
                }

                setNuevoProdNombre('');
                setNuevoProdMarca('');
                setNuevoProdPrecio('');
                setNuevoProdExistencia('');
                setNuevoProdStockMin('5');
                setShowNewProductModal(false);
            };

            const handleCambiarEstadoOrden = (ordenId, nuevoEstado, diagnosticoNota) => {
                setOrdenes(prev => prev.map(o => {
                    if (o.id === ordenId) {
                        return {
                            ...o,
                            estado: nuevoEstado,
                            diagnostico: diagnosticoNota !== undefined ? diagnosticoNota : o.diagnostico,
                            fechaEntrega: nuevoEstado === 'Finalizada' ? new Date().toLocaleString() : o.fechaEntrega
                        };
                    }
                    return o;
                }));
            };

            if (!currentUser) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-950 p-4">
                        <div className="w-full max-w-md bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl shadow-2xl">
                            <div className="text-center mb-6">
                                <span className="text-5xl block mb-2">🦝</span>
                                <h1 className="text-2xl font-bold text-white">Moto Mapache</h1>
                                <p className="text-xs text-brand-400 font-semibold uppercase tracking-wider">Sistema de Gestión de Taller</p>
                            </div>

                            {loginError && (
                                <div className="bg-rose-500/10 border border-rose-500/50 text-rose-400 text-xs p-3 rounded-xl mb-4">
                                    {loginError}
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 mb-1">Nombre de Usuario</label>
                                    <input 
                                        type="text" 
                                        value={loginUsername}
                                        onChange={e => setLoginUsername(e.target.value)}
                                        placeholder="Ingrese su usuario..."

                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-xs text-slate-300 min-w-[600px]">
                                        <thead className="bg-slate-800 uppercase text-slate-400">
                                            <tr>
                                                <th className="p-3">Órden</th>
                                                <th className="p-3">Placa</th>
                                                <th className="p-3">Mecánico</th>
                                                <th className="p-3">Problema</th>
                                                <th className="p-3">Estado</th>
                                                <th className="p-3">Total</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-800">
                                            {ordenes.map(o => {
                                                const m = motocicletas.find(x => x.id === o.motocicletaId);
                                                const mec = mecanicos.find(x => x.id === o.mecanicoId);
                                                return (
                                                    <tr key={o.id}>
                                                        <td className="p-3 font-mono text-brand-400 font-bold">#{o.id}</td>
                                                        <td className="p-3 font-mono">{m?.placa}</td>
                                                        <td className="p-3">{mec?.nombre} {mec?.apellido}</td>
                                                        <td className="p-3">{o.problemaReportado}</td>
                                                        <td className="p-3 font-bold">{o.estado}</td>
                                                        <td className="p-3 font-mono text-emerald-400 font-bold">Q {o.costoTotal.toFixed(2)}</td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* MÓDULO OTROS (VISTAS SQL) - PARA JEFE */}
                        {currentUser.rol.toLowerCase() === 'jefe' && activeTab === 'otros' && (
                            <div className="space-y-6">
                                <div className="border-b border-slate-800 pb-4">
                                    <h2 className="text-xl font-bold text-white mb-1">📁 Módulo de Otros / Consultas SQL Especializadas</h2>
                                    <p className="text-xs text-slate-400">Accede directamente a todas las Vistas Relacionales generadas por la base de datos de MySQL Workbench.</p>
                                </div>

                                <div className="flex flex-wrap gap-2">
                                    <button onClick={()=>setOtrosSubTab('vista_ordenes_pendientes')} className={`px-3 py-2 rounded-xl text-xs font-bold transition ${otrosSubTab === 'vista_ordenes_pendientes' ? 'bg-brand-500 text-slate-950' : 'bg-slate-900 text-slate-400 border border-slate-800 hover:bg-slate-800'}`}>⏳ V. Órdenes Pendientes</button>
                                    <button onClick={()=>setOtrosSubTab('vista_trabajos_por_mecanico')} className={`px-3 py-2 rounded-xl text-xs font-bold transition ${otrosSubTab === 'vista_trabajos_por_mecanico' ? 'bg-brand-500 text-slate-950' : 'bg-slate-900 text-slate-400 border border-slate-800 hover:bg-slate-800'}`}>🔧 V. Trabajos por Mecánico</button>
                                    <button onClick={()=>setOtrosSubTab('vista_historial_mantenimiento')} className={`px-3 py-2 rounded-xl text-xs font-bold transition ${otrosSubTab === 'vista_historial_mantenimiento' ? 'bg-brand-500 text-slate-950' : 'bg-slate-900 text-slate-400 border border-slate-800 hover:bg-slate-800'}`}>📜 V. Historial Mantenimiento</button>
                                    <button onClick={()=>setOtrosSubTab('vista_repuestos_baja_existencia')} className={`px-3 py-2 rounded-xl text-xs font-bold transition ${otrosSubTab === 'vista_repuestos_baja_existencia' ? 'bg-brand-500 text-slate-950' : 'bg-slate-900 text-slate-400 border border-slate-800 hover:bg-slate-800'}`}>⚠️ V. Stock Crítico</button>
                                </div>

                                <div className="bg-slate-900 p-4 sm:p-5 rounded-2xl border border-slate-800 overflow-x-auto">
                                    {otrosSubTab === 'vista_ordenes_pendientes' && (
                                        <div className="space-y-3 min-w-[500px]">
                                            <h4 className="text-sm font-bold text-white font-mono uppercase">VIEW: vista_ordenes_pendientes</h4>
                                            <table className="w-full text-left text-xs text-slate-300">
                                                <thead className="bg-slate-800 uppercase text-slate-400">
                                                    <tr><th className="p-2">ID</th><th className="p-2">Cliente</th><th className="p-2">DPI</th><th className="p-2">Moto</th><th className="p-2">Mecánico</th><th className="p-2">Estado</th></tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-800">
                                                    {ordenes.filter(o=>o.estado!=='Finalizada').map(o=>{
                                                        const m = motocicletas.find(x=>x.id===o.motocicletaId);
                                                        const c = clientes.find(x=>x.dpi===m?.clienteDpi);
                                                        const mec = mecanicos.find(x=>x.id===o.mecanicoId);
                                                        return (
                                                            <tr key={o.id}>
                                                                <td className="p-2 font-mono text-brand-400 font-bold">#{o.id}</td>
                                                                <td className="p-2 font-bold text-white">{c?.nombre} {c?.apellido}</td>
                                                                <td className="p-2 font-mono text-slate-400">{c?.dpi}</td>
                                                                <td className="p-2">{m?.marca} {m?.modelo} ({m?.placa})</td>
                                                                <td className="p-2">{mec?.nombre} {mec?.apellido}</td>
                                                                <td className="p-2"><span className="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded font-bold">{o.estado}</span></td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}

                                    {otrosSubTab === 'vista_trabajos_por_mecanico' && (
                                        <div className="space-y-3 min-w-[500px]">
                                            <h4 className="text-sm font-bold text-white font-mono uppercase">VIEW: vista_trabajos_por_mecanico</h4>
                                            <table className="w-full text-left text-xs text-slate-300">
                                                <thead className="bg-slate-800 uppercase text-slate-400">
                                                    <tr><th className="p-2">Mecánico</th><th className="p-2">Orden #</th><th className="p-2">Placa</th><th className="p-2">Falla Reportada</th><th className="p-2">Estado</th></tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-800">
                                                    {ordenes.map(o=>{
                                                        const mec = mecanicos.find(x=>x.id===o.mecanicoId);
                                                        const m = motocicletas.find(x=>x.id===o.motocicletaId);
                                                        return (
                                                            <tr key={o.id}>
                                                                <td className="p-2 font-bold text-white">{mec?.nombre} {mec?.apellido}</td>
                                                                <td className="p-2 font-mono text-brand-400">#{o.id}</td>
                                                                <td className="p-2 font-mono">{m?.placa}</td>
                                                                <td className="p-2">{o.problemaReportado}</td>
                                                                <td className="p-2 font-bold">{o.estado}</td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}

                                    {otrosSubTab === 'vista_historial_mantenimiento' && (
                                        <div className="space-y-3 min-w-[500px]">
                                            <h4 className="text-sm font-bold text-white font-mono uppercase">VIEW: vista_historial_mantenimiento</h4>
                                            <table className="w-full text-left text-xs text-slate-300">
                                                <thead className="bg-slate-800 uppercase text-slate-400">
                                                    <tr><th className="p-2">Placa</th><th className="p-2">Motocicleta</th><th className="p-2">Servicio Realizado</th><th className="p-2">Diagnóstico Mecánico</th></tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-800">
                                                    {ordenes.map(o=>{
                                                        const m = motocicletas.find(x=>x.id===o.motocicletaId);
                                                        return (
                                                            <tr key={o.id}>
                                                                <td className="p-2 font-mono text-brand-400 font-bold">{m?.placa}</td>
                                                                <td className="p-2">{m?.marca} {m?.modelo}</td>
                                                                <td className="p-2">{o.servicios.map(s=>s.nombre || s.nombre_servicio).join(', ')}</td>
                                                                <td className="p-2 text-slate-400 italic">{o.diagnostico || 'Sin observaciones'}</td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}

                                    {otrosSubTab === 'vista_repuestos_baja_existencia' && (
                                        <div className="space-y-3 min-w-[500px]">
                                            <h4 className="text-sm font-bold text-white font-mono uppercase">VIEW: vista_repuestos_baja_existencia</h4>
                                            <table className="w-full text-left text-xs text-slate-300">
                                                <thead className="bg-slate-800 uppercase text-slate-400">
                                                    <tr><th className="p-2">Repuesto</th><th className="p-2">Marca</th><th className="p-2">Existencia</th><th className="p-2">Mínimo</th><th className="p-2">Estado</th></tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-800">
                                                    {repuestos.filter(r=>r.existencia<=r.stockMinimo).map(r=>(
                                                        <tr key={r.id}>
                                                            <td className="p-2 font-bold text-white">{r.nombreRepuesto}</td>
                                                            <td className="p-2">{r.marca}</td>
                                                            <td className="p-2 font-bold text-rose-500">{r.existencia}</td>
                                                            <td className="p-2 text-slate-400">{r.stockMinimo}</td>
                                                            <td className="p-2"><span className="bg-rose-500/10 text-rose-400 border border-rose-500/20 px-2 py-0.5 rounded text-[10px] font-bold uppercase">Reabastecer</span></td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODAL EDITAR CLIENTE */}
                    {editingCliente && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-md w-full space-y-4">
                                <h3 className="text-lg font-bold text-white">✏️ Modificar Cliente (DPI: {editingCliente.dpi})</h3>
                                <form onSubmit={handleActualizarCliente} className="space-y-3">
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Nombre</label>
                                        <input 
                                            type="text" 
                                            value={editingCliente.nombre} 
                                            onChange={e => setEditingCliente({ ...editingCliente, nombre: e.target.value })}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white" 
                                            required 
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Apellido</label>
                                        <input 
                                            type="text" 
                                            value={editingCliente.apellido} 
                                            onChange={e => setEditingCliente({ ...editingCliente, apellido: e.target.value })}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white" 
                                            required 
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Teléfono</label>
                                        <input 
                                            type="text" 
                                            value={editingCliente.telefono} 
                                            onChange={e => setEditingCliente({ ...editingCliente, telefono: e.target.value })}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white" 
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Dirección</label>
                                        <input 
                                            type="text" 
                                            value={editingCliente.direccion} 
                                            onChange={e => setEditingCliente({ ...editingCliente, direccion: e.target.value })}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white" 
                                        />
                                    </div>

                                    <div className="flex gap-2 justify-end pt-3">
                                        <button type="button" onClick={() => setEditingCliente(null)} className="bg-slate-800 text-slate-300 text-xs px-4 py-2.5 rounded-xl font-bold">Cancelar</button>
                                        <button type="submit" className="bg-brand-500 text-slate-950 text-xs px-4 py-2.5 rounded-xl font-bold">Guardar Cambios</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL EDITAR SERVICIO */}
                    {editingServicio && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-md w-full space-y-4">
                                <h3 className="text-lg font-bold text-white">✏️ Modificar Servicio</h3>
                                <form onSubmit={handleActualizarServicio} className="space-y-3">
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Nombre del Servicio</label>
                                        <input 
                                            type="text" 
                                            value={editingServicio.nombre || editingServicio.nombre_servicio} 
                                            onChange={e => setEditingServicio({ ...editingServicio, nombre: e.target.value, nombre_servicio: e.target.value })}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-brand-500" 
                                            required 
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Precio Base (Q)</label>
                                        <input 
                                            type="number" 
                                            step="0.01"
                                            value={editingServicio.precio || editingServicio.precio_base} 
                                            onChange={e => setEditingServicio({ ...editingServicio, precio: parseFloat(e.target.value), precio_base: parseFloat(e.target.value) })}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-brand-500" 
                                            required 
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Descripción</label>
                                        <textarea 
                                            value={editingServicio.descripcion || ''} 
                                            onChange={e => setEditingServicio({ ...editingServicio, descripcion: e.target.value })}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-brand-500" 
                                            rows="2"
                                        />
                                    </div>

                                    <div className="flex gap-2 justify-end pt-3">
                                        <button type="button" onClick={() => setEditingServicio(null)} className="bg-slate-800 text-slate-300 text-xs px-4 py-2.5 rounded-xl font-bold">Cancelar</button>
                                        <button type="submit" className="bg-brand-500 text-slate-950 text-xs px-4 py-2.5 rounded-xl font-bold">Guardar Cambios</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL NUEVO PRODUCTO */}
                    {showNewProductModal && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-md w-full space-y-4">
                                <h3 className="text-lg font-bold text-white">✨ Registrar Nuevo Repuesto en Catálogo</h3>
                                <form onSubmit={handleCrearNuevoProducto} className="space-y-3">
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Nombre del Repuesto / Producto</label>
                                        <input 
                                            type="text" 
                                            value={nuevoProdNombre} 
                                            onChange={e => setNuevoProdNombre(e.target.value)}
                                            placeholder="Ej. Kit de Arrastre, Bujía C7HSA..."
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-brand-500" 
                                            required 
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs text-slate-400 mb-1">Marca</label>
                                            <input 
                                                type="text" 
                                                value={nuevoProdMarca} 
                                                onChange={e => setNuevoProdMarca(e.target.value)}
                                                placeholder="Ej. NGK, Honda..."
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-brand-500" 
                                                required 
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-slate-400 mb-1">Precio Venta (Q)</label>
                                            <input 
                                                type="number" 
                                                step="0.01"
                                                min="0"
                                                value={nuevoProdPrecio} 
                                                onChange={e => setNuevoProdPrecio(e.target.value)}
                                                placeholder="0.00"
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-brand-500" 
                                                required 
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs text-slate-400 mb-1">Stock Inicial</label>
                                            <input 
                                                type="number" 
                                                min="0"
                                                value={nuevoProdExistencia} 
                                                onChange={e => setNuevoProdExistencia(e.target.value)}
                                                placeholder="Unidades"
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-brand-500" 
                                                required 
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-slate-400 mb-1">Stock Mínimo (Alerta)</label>
                                            <input 
                                                type="number" 
                                                min="1"
                                                value={nuevoProdStockMin} 
                                                onChange={e => setNuevoProdStockMin(e.target.value)}
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-brand-500" 
                                                required 
                                            />
                                        </div>
                                    </div>

                                    <div className="flex gap-2 justify-end pt-3">
                                        <button type="button" onClick={() => setShowNewProductModal(false)} className="bg-slate-800 text-slate-300 text-xs px-4 py-2.5 rounded-xl font-bold">Cancelar</button>
                                        <button type="submit" className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-2.5 rounded-xl font-bold">Guardar Producto</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL REABASTECER STOCK */}
                    {showStockModal && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-md w-full space-y-4">
                                <h3 className="text-lg font-bold text-white">➕ Entrada de Stock / Reabastecimiento</h3>
                                <form onSubmit={handleAgregarStock} className="space-y-4">
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Repuesto a Ingresar</label>
                                        <select 
                                            value={selectedRepuestoId} 
                                            onChange={e => setSelectedRepuestoId(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white"
                                        >
                                            {repuestos.map(r => (
                                                <option key={r.id} value={r.id}>{r.nombreRepuesto} (Stock Actual: {r.existencia})</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Cantidad de Unidades a Sumar</label>
                                        <input 
                                            type="number" 
                                            min="1" 
                                            value={stockCantidad} 
                                            onChange={e => setStockCantidad(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white" 
                                            required 
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Nota / Proveedor / Descripción</label>
                                        <input 
                                            type="text" 
                                            value={stockNota} 
                                            onChange={e => setStockNota(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white" 
                                            required 
                                        />
                                    </div>

                                    <div className="flex gap-2 justify-end pt-2">
                                        <button type="button" onClick={() => setShowStockModal(false)} className="bg-slate-800 text-slate-300 text-xs px-4 py-2.5 rounded-xl font-bold">Cancelar</button>
                                        <button type="submit" className="bg-brand-500 hover:bg-brand-600 text-slate-950 text-xs px-4 py-2.5 rounded-xl font-bold">Guardar Entrada</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
