<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión - Taller Moto Mapache</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fffbe1',
                            100: '#fff6b8',
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                            900: '#78350f',
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // USUARIOS REGISTRADOS
        const systemUsers = [
            { username: 'jefe_admin', password: '123', rol: 'jefe', nombre: 'Administrador General', mecanicoId: null },
            { username: 'recepcion1', password: '123', rol: 'recepcionista', nombre: 'Recepcionista Principal', mecanicoId: null },
            { username: 'mecanico_juan', password: '123', rol: 'mecanico', nombre: 'Juan Pérez', mecanicoId: 1 },
            { username: 'mecanico_luis', password: '123', rol: 'mecanico', nombre: 'Luis Ramírez', mecanicoId: 2 }
        ];

        // DATOS INICIALES
        const initialClientes = [
            { dpi: '1901234560901', nombre: 'Carlos', apellido: 'Mendoza', telefono: '5551-2345', email: 'carlos@gmail.com', direccion: 'Zona 1, Quetzaltenango' },
            { dpi: '2010987650901', nombre: 'Ana', apellido: 'Gómez', telefono: '5558-7654', email: 'ana.gomez@gmail.com', direccion: 'Zona 3, Quetzaltenango' }
        ];

        const initialMotocicletas = [
            { id: 1, clienteDpi: '1901234560901', placa: 'M-123ABC', marca: 'Yamaha', modelo: 'FZ 25', anio: 2022, color: 'Negro' },
            { id: 2, clienteDpi: '2010987650901', placa: 'M-987XYZ', marca: 'Honda', modelo: 'Navi 110', anio: 2021, color: 'Rojo' }
        ];

        const initialMecanicos = [
            { id: 1, nombre: 'Juan', apellido: 'Pérez', especialidad: 'Sistemas Eléctricos y Motor' },
            { id: 2, nombre: 'Luis', apellido: 'Ramírez', especialidad: 'Frenos y Mantenimiento General' }
        ];

        const initialServicios = [
            { id: 1, nombre: 'Cambio de Aceite y Filtro', precio: 75.00 },
            { id: 2, nombre: 'Revisión y Ajuste de Frenos', precio: 100.00 },
            { id: 3, nombre: 'Alineación y Balanceo', precio: 85.00 },
            { id: 4, nombre: 'Limpieza de Carburador / Inyectores', precio: 150.00 },
            { id: 5, nombre: 'Servicio Mayor Completo', precio: 350.00 }
        ];

        const initialRepuestos = [
            { id: 1, nombreRepuesto: 'Aceite Yamalube 20W50', marca: 'Yamalube', precioVenta: 65.00, existencia: 20, stockMinimo: 5 },
            { id: 2, nombreRepuesto: 'Pastillas de Freno Delanteras', marca: 'Yamaha', precioVenta: 120.00, existencia: 8, stockMinimo: 5 },
            { id: 3, nombreRepuesto: 'Filtro de Aire OEM', marca: 'Honda', precioVenta: 45.00, existencia: 15, stockMinimo: 4 },
            { id: 4, nombreRepuesto: 'Bujía NGK C7HSA', marca: 'NGK', precioVenta: 25.00, existencia: 30, stockMinimo: 10 }
        ];

        const initialOrdenes = [
            {
                id: 1,
                motocicletaId: 1,
                mecanicoId: 1,
                fechaIngreso: '2026-03-01 09:30',
                fechaEntrega: null,
                problemaReportado: 'Ruido extraño al frenar y requiere cambio de aceite',
                diagnostico: 'Pastillas desgastadas al 80%. Se requiere cambio.',
                estado: 'En Proceso',
                servicios: [{ id: 1, nombre: 'Cambio de Aceite y Filtro', precio: 75.00 }],
                repuestos: [{ id: 1, nombre: 'Aceite Yamalube 20W50', cantidad: 1, precioUnitario: 65.00, subtotal: 65.00 }],
                costoTotal: 140.00,
                saldoPendiente: 40.00
            },
            {
                id: 2,
                motocicletaId: 2,
                mecanicoId: 2,
                fechaIngreso: '2026-03-02 11:15',
                fechaEntrega: null,
                problemaReportado: 'Ajuste general de frenos traseros',
                diagnostico: 'Falta lubricar guaya y calibrar tambor.',
                estado: 'Pendiente',
                servicios: [{ id: 2, nombre: 'Revisión y Ajuste de Frenos', precio: 100.00 }],
                repuestos: [],
                costoTotal: 100.00,
                saldoPendiente: 100.00
            }
        ];

        const initialMovimientos = [
            { id: 1, repuestoNombre: 'Aceite Yamalube 20W50', tipo: 'Entrada', cantidad: 20, usuario: 'jefe_admin', fechaHora: '2026-03-01 08:00', descripcion: 'Carga inicial de inventario' },
            { id: 2, repuestoNombre: 'Pastillas de Freno Delanteras', tipo: 'Entrada', cantidad: 10, usuario: 'recepcion1', fechaHora: '2026-03-01 08:30', descripcion: 'Reabastecimiento de repuestos' },
            { id: 3, repuestoNombre: 'Pastillas de Freno Delanteras', tipo: 'Salida', cantidad: 2, usuario: 'mecanico_juan', fechaHora: '2026-03-01 10:00', descripcion: 'Uso en Órden de Trabajo #1' }
        ];

        function App() {
            const [currentUser, setCurrentUser] = useState(null);
            const [loginUsername, setLoginUsername] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [loginError, setLoginError] = useState('');

            const [activeTab, setActiveTab] = useState('dashboard');
            const [otrosSubTab, setOtrosSubTab] = useState('vista_ordenes_pendientes');

            const [clientes, setClientes] = useState(initialClientes);
            const [motocicletas, setMotocicletas] = useState(initialMotocicletas);
            const [mecanicos] = useState(initialMecanicos);
            const [servicios] = useState(initialServicios);
            const [repuestos, setRepuestos] = useState(initialRepuestos);
            const [ordenes, setOrdenes] = useState(initialOrdenes);
            const [movimientos, setMovimientos] = useState(initialMovimientos);

            // FORMULARIO AGREGAR CLIENTE Y MOTO
            const [nuevoClienteDpi, setNuevoClienteDpi] = useState('');
            const [nuevoClienteNombre, setNuevoClienteNombre] = useState('');
            const [nuevoClienteApellido, setNuevoClienteApellido] = useState('');
            const [nuevoClienteTel, setNuevoClienteTel] = useState('');
            const [nuevoClienteEmail, setNuevoClienteEmail] = useState('');
            const [nuevoClienteDir, setNuevoClienteDir] = useState('');

            const [nuevaPlaca, setNuevaPlaca] = useState('');
            const [nuevaMarca, setNuevaMarca] = useState('');
            const [nuevoModelo, setNuevoModelo] = useState('');
            const [nuevoAnio, setNuevoAnio] = useState('2023');
            const [nuevoColor, setNuevoColor] = useState('');

            // FORMULARIO CREAR ÓRDEN DE TRABAJO
            const [ordenClienteDpi, setOrdenClienteDpi] = useState(initialClientes[0].dpi);
            const [ordenMotoId, setOrdenMotoId] = useState(initialMotocicletas[0].id);
            const [ordenMecanicoId, setOrdenMecanicoId] = useState(initialMecanicos[0].id);
            const [ordenFalla, setOrdenFalla] = useState('');
            const [ordenServiciosSeleccionados, setOrdenServiciosSeleccionados] = useState([]);
            const [ordenMensajeExito, setOrdenMensajeExito] = useState('');

            // MODAL AGREGAR STOCK
            const [showStockModal, setShowStockModal] = useState(false);
            const [selectedRepuestoId, setSelectedRepuestoId] = useState(1);
            const [stockCantidad, setStockCantidad] = useState(5);
            const [stockNota, setStockNota] = useState('Compra a proveedor');

            // MODAL AGREGAR NUEVO PRODUCTO AL CATÁLOGO
            const [showNewProductModal, setShowNewProductModal] = useState(false);
            const [nuevoProdNombre, setNuevoProdNombre] = useState('');
            const [nuevoProdMarca, setNuevoProdMarca] = useState('');
            const [nuevoProdPrecio, setNuevoProdPrecio] = useState('');
            const [nuevoProdExistencia, setNuevoProdExistencia] = useState('');
            const [nuevoProdStockMin, setNuevoProdStockMin] = useState('5');

            const handleLogin = (e) => {
                e.preventDefault();
                const user = systemUsers.find(u => u.username === loginUsername && u.password === loginPassword);
                if (user) {
                    setCurrentUser(user);
                    setLoginError('');
                    setLoginUsername('');
                    setLoginPassword('');
                    if (user.rol === 'jefe') setActiveTab('dashboard');
                    else if (user.rol === 'recepcionista') setActiveTab('recepcion_ordenes');
                    else if (user.rol === 'mecanico') setActiveTab('mecanico_trabajos');
                } else {
                    setLoginError('Usuario o contraseña incorrectos.');
                }
            };

            // CREAR CLIENTE Y MOTO
            const handleGuardarClienteYMoto = (e) => {
                e.preventDefault();
                if (!nuevoClienteDpi || nuevoClienteDpi.length !== 13) {
                    alert('El DPI debe contener exactamente 13 dígitos numericos.');
                    return;
                }

                const existeCliente = clientes.some(c => c.dpi === nuevoClienteDpi);
                if (!existeCliente) {
                    const newCliente = {
                        dpi: nuevoClienteDpi,
                        nombre: nuevoClienteNombre,
                        apellido: nuevoClienteApellido,
                        telefono: nuevoClienteTel,
                        email: nuevoClienteEmail,
                        direccion: nuevoClienteDir
                    };
                    setClientes([...clientes, newCliente]);
                }

                if (nuevaPlaca) {
                    const newMoto = {
                        id: motocicletas.length + 1,
                        clienteDpi: nuevoClienteDpi,
                        placa: nuevaPlaca.toUpperCase(),
                        marca: nuevaMarca,
                        modelo: nuevoModelo,
                        anio: parseInt(nuevoAnio),
                        color: nuevoColor
                    };
                    setMotocicletas([...motocicletas, newMoto]);
                }

                alert('Cliente y Motocicleta registrados correctamente.');
                setNuevoClienteDpi('');
                setNuevoClienteNombre('');
                setNuevoClienteApellido('');
                setNuevoClienteTel('');
                setNuevoClienteEmail('');
                setNuevoClienteDir('');
                setNuevaPlaca('');
                setNuevaMarca('');
                setNuevoModelo('');
                setNuevoColor('');
            };

            // AGREGAR O QUITAR SERVICIOS EN CREAR ÓRDEN
            const handleToggleServicioOrden = (servicio) => {
                const existe = ordenServiciosSeleccionados.some(s => s.id === servicio.id);
                if (existe) {
                    setOrdenServiciosSeleccionados(ordenServiciosSeleccionados.filter(s => s.id !== servicio.id));
                } else {
                    setOrdenServiciosSeleccionados([...ordenServiciosSeleccionados, servicio]);
                }
            };

            // CREAR ÓRDEN DE TRABAJO
            const handleCrearOrdenTrabajo = (e) => {
                e.preventDefault();
                if (!ordenFalla.trim()) {
                    alert('Debe ingresar la falla o problema reportado.');
                    return;
                }

                const costoServicios = ordenServiciosSeleccionados.reduce((acc, s) => acc + s.precio, 0);
                const nuevaOrden = {
                    id: ordenes.length + 1,
                    motocicletaId: parseInt(ordenMotoId),
                    mecanicoId: parseInt(ordenMecanicoId),
                    fechaIngreso: new Date().toLocaleString(),
                    fechaEntrega: null,
                    problemaReportado: ordenFalla,
                    diagnostico: 'Pendiente de diagnóstico inicial.',
                    estado: 'Pendiente',
                    servicios: ordenServiciosSeleccionados,
                    repuestos: [],
                    costoTotal: costoServicios,
                    saldoPendiente: costoServicios
                };

                setOrdenes([nuevaOrden, ...ordenes]);
                setOrdenMensajeExito(`¡Órden de Trabajo #${nuevaOrden.id} generada exitosamente!`);
                setOrdenFalla('');
                setOrdenServiciosSeleccionados([]);
                setTimeout(() => setOrdenMensajeExito(''), 4000);
            };

            const handleAgregarStock = (e) => {
                e.preventDefault();
                const repuestoId = parseInt(selectedRepuestoId);
                const cant = parseInt(stockCantidad);

                setRepuestos(prev => prev.map(r => r.id === repuestoId ? { ...r, existencia: r.existencia + cant } : r));
                const rep = repuestos.find(r => r.id === repuestoId);

                const newMov = {
                    id: movimientos.length + 1,
                    repuestoNombre: rep?.nombreRepuesto || 'Repuesto',
                    tipo: 'Entrada',
                    cantidad: cant,
                    usuario: currentUser.username,
                    fechaHora: new Date().toLocaleString(),
                    descripcion: stockNota
                };

                setMovimientos([newMov, ...movimientos]);
                setShowStockModal(false);
                setStockCantidad(5);
                setStockNota('Compra a proveedor');
            };

            const handleCrearNuevoProducto = (e) => {
                e.preventDefault();
                const newId = repuestos.length + 1;
                const cantInicial = parseInt(nuevoProdExistencia) || 0;
                const precio = parseFloat(nuevoProdPrecio) || 0.0;
                const stockMin = parseInt(nuevoProdStockMin) || 5;

                const newRepuesto = {
                    id: newId,
                    nombreRepuesto: nuevoProdNombre,
                    marca: nuevoProdMarca,
                    precioVenta: precio,
                    existencia: cantInicial,
                    stockMinimo: stockMin
                };

                setRepuestos([...repuestos, newRepuesto]);

                if (cantInicial > 0) {
                    const newMov = {
                        id: movimientos.length + 1,
                        repuestoNombre: nuevoProdNombre,
                        tipo: 'Entrada',
                        cantidad: cantInicial,
                        usuario: currentUser.username,
                        fechaHora: new Date().toLocaleString(),
                        descripcion: 'Creación de nuevo repuesto en catálogo'
                    };
                    setMovimientos([newMov, ...movimientos]);
                }

                setNuevoProdNombre('');
                setNuevoProdMarca('');
                setNuevoProdPrecio('');
                setNuevoProdExistencia('');
                setNuevoProdStockMin('5');
                setShowNewProductModal(false);
            };

            const handleCambiarEstadoOrden = (ordenId, nuevoEstado, diagnosticoNota) => {
                setOrdenes(prev => prev.map(o => {
                    if (o.id === ordenId) {
                        return {
                            ...o,
                            estado: nuevoEstado,
                            diagnostico: diagnosticoNota !== undefined ? diagnosticoNota : o.diagnostico,
                            fechaEntrega: nuevoEstado === 'Finalizada' ? new Date().toLocaleString() : o.fechaEntrega
                        };
                    }
                    return o;
                }));
            };

            if (!currentUser) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-950 p-4">
                        <div className="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl">
                            <div className="text-center mb-6">
                                <span className="text-5xl block mb-2">🦝</span>
                                <h1 className="text-2xl font-bold text-white">Moto Mapache</h1>
                                <p className="text-xs text-brand-400 font-semibold uppercase tracking-wider">Sistema de Gestión de Taller</p>
                            </div>

                            {loginError && (
                                <div className="bg-rose-500/10 border border-rose-500/50 text-rose-400 text-xs p-3 rounded-xl mb-4">
                                    {loginError}
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 mb-1">Nombre de Usuario</label>
                                    <input 
                                        type="text" 
                                        value={loginUsername}
                                        onChange={e => setLoginUsername(e.target.value)}
                                        placeholder="Ingrese su usuario..."
                                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:border-brand-500 focus:outline-none"
                                        required
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 mb-1">Contraseña</label>
                                    <input 
                                        type="password" 
                                        value={loginPassword}
                                        onChange={e => setLoginPassword(e.target.value)}
                                        placeholder="••••••••"
                                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:border-brand-500 focus:outline-none"
                                        required
                                    />
                                </div>
                                <button type="submit" className="w-full bg-brand-500 hover:bg-brand-600 font-bold text-slate-950 p-3 rounded-xl text-sm transition shadow-lg shadow-brand-500/20">
                                    Iniciar Sesión
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen bg-slate-950 text-slate-100 overflow-hidden">
                    <aside className="w-64 bg-slate-900 border-r border-slate-800 p-4 flex flex-col justify-between">
                        <div>
                            <div className="flex items-center gap-3 mb-6 p-2">
                                <span className="text-3xl">🦝</span>
                                <div>
                                    <h1 className="font-bold text-lg text-white">Moto Mapache</h1>
                                    <p className="text-[10px] text-brand-400 font-bold uppercase">{currentUser.rol}</p>
                                </div>
                            </div>

                            <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 mb-6">
                                <p className="text-[10px] text-slate-500 uppercase font-bold">Usuario Activo</p>
                                <p className="text-sm font-semibold text-white">{currentUser.nombre}</p>
                                <p className="text-xs text-slate-400 font-mono">@{currentUser.username}</p>
                            </div>

                            <nav className="space-y-1">
                                {currentUser.rol === 'jefe' && (
                                    <>
                                        <button onClick={()=>setActiveTab('dashboard')} className={`w-full text-left p-2.5 rounded-xl text-sm font-medium transition ${activeTab === 'dashboard' ? 'bg-brand-600 text-white' : 'hover:bg-slate-800 text-slate-400'}`}>📊 Dashboard General</button>
                                        <button onClick={()=>setActiveTab('recepcion_ordenes')} className={`w-full text-left p-2.5 rounded-xl text-sm font-medium transition ${activeTab === 'recepcion_ordenes' ? 'bg-brand-600 text-white' : 'hover:bg-slate-800 text-slate-400'}`}>📝 Crear Órden de Trabajo</button>
                                        <button onClick={()=>setActiveTab('clientes')} className={`w-full text-left p-2.5 rounded-xl text-sm font-medium transition ${activeTab === 'clientes' ? 'bg-brand-600 text-white' : 'hover:bg-slate-800 text-slate-400'}`}>👥 Clientes & Motos (DPI)</button>
                                        <button onClick={()=>setActiveTab('ordenes_jefe')} className={`w-full text-left p-2.5 rounded-xl text-sm font-medium transition ${activeTab === 'ordenes_jefe' ? 'bg-brand-600 text-white' : 'hover:bg-slate-800 text-slate-400'}`}>🛠️ Todas las Órdenes</button>
                                        <button onClick={()=>setActiveTab('inventario')} className={`w-full text-left p-2.5 rounded-xl text-sm font-medium transition ${activeTab === 'inventario' ? 'bg-brand-600 text-white' : 'hover:bg-slate-800 text-slate-400'}`}>📦 Control Inventario</button>
                                        <button onClick={()=>setActiveTab('auditoria')} className={`w-full text-left p-2.5 rounded-xl text-sm font-medium transition ${activeTab === 'auditoria' ? 'bg-brand-600 text-white' : 'hover:bg-slate-800 text-slate-400'}`}>📜 Historial Transacciones</button>
                                        <button onClick={()=>setActiveTab('otros')} className={`w-full text-left p-2.5 rounded-xl text-sm font-medium transition ${activeTab === 'otros' ? 'bg-brand-600 text-white' : 'hover:bg-slate-800 text-slate-400'}`}>📁 Otros (Vistas SQL)</button>
                                    </>
                                )}

                                {currentUser.rol === 'recepcionista' && (
                                    <>
                                        <button onClick={()=>setActiveTab('recepcion_ordenes')} className={`w-full text-left p-2.5 rounded-xl text-sm font-medium transition ${activeTab === 'recepcion_ordenes' ? 'bg-brand-600 text-white' : 'hover:bg-slate-800 text-slate-400'}`}>📝 Crear Órden de Trabajo</button>
                                        <button onClick={()=>setActiveTab('clientes')} className={`w-full text-left p-2.5 rounded-xl text-sm font-medium transition ${activeTab === 'clientes' ? 'bg-brand-600 text-white' : 'hover:bg-slate-800 text-slate-400'}`}>👤 Registrar Cliente (DPI)</button>
                                        <button onClick={()=>setActiveTab('vista_pendientes')} className={`w-full text-left p-2.5 rounded-xl text-sm font-medium transition ${activeTab === 'vista_pendientes' ? 'bg-brand-600 text-white' : 'hover:bg-slate-800 text-slate-400'}`}>⏳ Órdenes Pendientes</button>
                                        <button onClick={()=>setActiveTab('inventario')} className={`w-full text-left p-2.5 rounded-xl text-sm font-medium transition ${activeTab === 'inventario' ? 'bg-brand-600 text-white' : 'hover:bg-slate-800 text-slate-400'}`}>📦 Inventario & Stock</button>
                                        <button onClick={()=>setActiveTab('auditoria')} className={`w-full text-left p-2.5 rounded-xl text-sm font-medium transition ${activeTab === 'auditoria' ? 'bg-brand-600 text-white' : 'hover:bg-slate-800 text-slate-400'}`}>📜 Historial Transacciones</button>
                                    </>
                                )}

                                {currentUser.rol === 'mecanico' && (
                                    <>
                                        <button onClick={()=>setActiveTab('mecanico_trabajos')} className={`w-full text-left p-2.5 rounded-xl text-sm font-medium transition ${activeTab === 'mecanico_trabajos' ? 'bg-brand-600 text-white' : 'hover:bg-slate-800 text-slate-400'}`}>🔧 Mis Trabajos Asignados</button>
                                        <button onClick={()=>setActiveTab('mecanico_stock')} className={`w-full text-left p-2.5 rounded-xl text-sm font-medium transition ${activeTab === 'mecanico_stock' ? 'bg-brand-600 text-white' : 'hover:bg-slate-800 text-slate-400'}`}>📦 Consultar Repuestos</button>
                                    </>
                                )}
                            </nav>
                        </div>

                        <button onClick={()=>setCurrentUser(null)} className="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 p-2.5 rounded-xl text-sm font-bold transition flex items-center justify-center gap-2">
                            🚪 Cerrar Sesión
                        </button>
                    </aside>

                    <main className="flex-1 p-6 overflow-y-auto">
                        {/* DASHBOARD JEFE */}
                        {currentUser.rol === 'jefe' && activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <h2 className="text-xl font-bold text-white">Panel General de Control (Jefe)</h2>
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                    <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                                        <p className="text-xs text-slate-400 uppercase font-semibold">Órdenes Registradas</p>
                                        <h3 className="text-3xl font-extrabold text-white mt-2">{ordenes.length}</h3>
                                    </div>
                                    <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800">

                                            <table className="w-full text-left text-xs text-slate-300">
                                                <thead className="bg-slate-800 uppercase text-slate-400">
                                                    <tr><th className="p-2">Placa</th><th className="p-2">Vehículo</th><th className="p-2">Propietario (DPI)</th><th className="p-2">Fecha Ingreso</th><th className="p-2">Estado Actual</th></tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-800">
                                                    {ordenes.map(o=>{
                                                        const m = motocicletas.find(x=>x.id===o.motocicletaId);
                                                        const c = clientes.find(x=>x.dpi===m?.clienteDpi);
                                                        return (
                                                            <tr key={o.id}>
                                                                <td className="p-2 font-mono text-brand-400 font-bold">{m?.placa}</td>
                                                                <td className="p-2 text-white font-semibold">{m?.marca} {m?.modelo} ({m?.color})</td>
                                                                <td className="p-2">{c?.nombre} {c?.apellido} ({c?.dpi})</td>
                                                                <td className="p-2 text-slate-400">{o.fechaIngreso}</td>
                                                                <td className="p-2"><span className="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded font-bold">{o.estado}</span></td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* ÓRDEN DE TRABAJO GENERAL */}
                        {(activeTab === 'ordenes_jefe' || activeTab === 'vista_pendientes') && (
                            <div className="space-y-4">
                                <h3 className="text-lg font-bold text-white">Órdenes de Trabajo Registradas</h3>
                                <div className="grid grid-cols-1 gap-4">
                                    {ordenes.map(o => {
                                        const moto = motocicletas.find(m => m.id === o.motocicletaId);
                                        const mec = mecanicos.find(m => m.id === o.mecanicoId);
                                        return (
                                            <div key={o.id} className="bg-slate-900 p-5 rounded-2xl border border-slate-800 flex justify-between items-center">
                                                <div>
                                                    <span className="text-xs font-mono text-brand-400 font-bold">ÓRDEN #{o.id} - {o.fechaIngreso}</span>
                                                    <h4 className="text-white font-bold">{moto?.marca} {moto?.modelo} ({moto?.placa})</h4>
                                                    <p className="text-xs text-slate-400">Mecánico: {mec ? `${mec.nombre} ${mec.apellido}` : 'Sin asignar'}</p>
                                                    <p className="text-xs text-slate-300 mt-1">Falla: {o.problemaReportado}</p>
                                                    {o.servicios.length > 0 && (
                                                        <div className="mt-2 flex flex-wrap gap-1">
                                                            {o.servicios.map(s => (
                                                                <span key={s.id} className="bg-slate-950 text-slate-300 border border-slate-800 text-[10px] px-2 py-0.5 rounded">
                                                                    {s.nombre}
                                                                </span>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                                <div className="text-right">
                                                    <span className={`px-3 py-1 rounded-full text-xs font-bold ${o.estado === 'Finalizada' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'}`}>{o.estado}</span>
                                                    <p className="text-sm font-extrabold text-emerald-400 mt-2">Total: Q {o.costoTotal.toFixed(2)}</p>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* MÓDULO DE INVENTARIO CON BOTONES AGREGAR PRODUCTO Y SUMAR STOCK */}
                        {(activeTab === 'inventario' || activeTab === 'mecanico_stock') && (
                            <div className="space-y-4">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                    <h3 className="text-lg font-bold text-white">Stock e Inventario de Repuestos</h3>
                                    {(currentUser.rol === 'jefe' || currentUser.rol === 'recepcionista') && (
                                        <div className="flex gap-2">
                                            <button 
                                                onClick={() => setShowNewProductModal(true)} 
                                                className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-xl text-xs transition flex items-center gap-1.5"
                                            >
                                                ✨ Crear Nuevo Producto
                                            </button>
                                            <button 
                                                onClick={() => setShowStockModal(true)} 
                                                className="bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs transition flex items-center gap-1.5"
                                            >
                                                ➕ Sumar Stock Existente
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {repuestos.map(r => (
                                        <div key={r.id} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                                            <div>
                                                <span className="text-[10px] text-slate-500 font-mono">ID #{r.id}</span>
                                                <h4 className="font-bold text-white">{r.nombreRepuesto}</h4>
                                                <p className="text-xs text-slate-400">Marca: {r.marca}</p>
                                                <p className="text-xs text-slate-400">Precio Venta: Q {r.precioVenta.toFixed(2)}</p>
                                                <p className="text-[10px] text-slate-500">Mínimo requerido: {r.stockMinimo}</p>
                                            </div>
                                            <div className="text-right">
                                                <span className={`text-2xl font-extrabold block ${r.existencia <= r.stockMinimo ? 'text-rose-500' : 'text-brand-400'}`}>
                                                    {r.existencia}
                                                </span>
                                                <span className="text-[10px] text-slate-400 uppercase font-bold">Unidades</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* HISTORIAL DE TRANSACCIONES */}
                        {activeTab === 'auditoria' && (
                            <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-4">
                                <div>
                                    <h3 className="text-lg font-bold text-white">Historial de Transacciones y Auditoría de Stock</h3>
                                    <p className="text-xs text-slate-400">Muestra en tiempo real qué usuario agregó o descontó productos del inventario con fecha y hora.</p>
                                </div>

                                <table className="w-full text-left text-sm text-slate-300">
                                    <thead className="bg-slate-800 text-xs uppercase text-slate-400">
                                        <tr>
                                            <th className="p-3">#</th>
                                            <th className="p-3">Repuesto</th>
                                            <th className="p-3">Tipo Movimiento</th>
                                            <th className="p-3">Cantidad</th>
                                            <th className="p-3">Usuario Que Registró</th>
                                            <th className="p-3">Fecha y Hora</th>
                                            <th className="p-3">Descripción</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800">
                                        {movimientos.map(m => (
                                            <tr key={m.id}>
                                                <td className="p-3 font-mono text-slate-500">{m.id}</td>
                                                <td className="p-3 font-bold text-white">{m.repuestoNombre}</td>
                                                <td className="p-3">
                                                    <span className={`px-2 py-0.5 rounded text-xs font-bold ${m.tipo === 'Entrada' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'}`}>
                                                        {m.tipo}
                                                    </span>
                                                </td>
                                                <td className="p-3 font-bold">{m.cantidad}</td>
                                                <td className="p-3 font-mono text-brand-400 font-semibold">@{m.usuario}</td>
                                                <td className="p-3 text-xs text-slate-400">{m.fechaHora}</td>
                                                <td className="p-3 text-xs text-slate-300">{m.descripcion}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {/* MÓDULO DEL MECÁNICO: ACTUALIZACIÓN DE ESTADOS */}
                        {currentUser.rol === 'mecanico' && activeTab === 'mecanico_trabajos' && (
                            <div className="space-y-4">
                                <div>
                                    <h3 className="text-lg font-bold text-white">Trabajos Asignados a {currentUser.nombre}</h3>
                                    <p className="text-xs text-slate-400">Permite cambiar en tiempo real el estado de avance de la reparación y agregar notas de diagnóstico.</p>
                                </div>

                                {ordenes.filter(o => o.mecanicoId === currentUser.mecanicoId).map(o => {
                                    const moto = motocicletas.find(m => m.id === o.motocicletaId);
                                    return (
                                        <div key={o.id} className="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-4">
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <span className="text-xs font-mono text-brand-400 font-bold">ÓRDEN DE TRABAJO #{o.id}</span>
                                                    <h4 className="text-white font-bold text-lg">{moto?.marca} {moto?.modelo} ({moto?.placa})</h4>
                                                    <p className="text-xs text-slate-400">Fecha Ingreso: {o.fechaIngreso}</p>
                                                </div>

                                                <div>
                                                    <label className="block text-[10px] text-slate-400 font-bold uppercase mb-1">Cambiar Estado:</label>
                                                    <select 
                                                        value={o.estado} 
                                                        onChange={(e) => handleCambiarEstadoOrden(o.id, e.target.value)}
                                                        className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-xs font-bold text-brand-400 focus:outline-none"
                                                    >
                                                        <option value="Pendiente">⏳ Pendiente</option>
                                                        <option value="En Proceso">🔧 En Proceso</option>
                                                        <option value="Finalizada">✅ Finalizada</option>
                                                    </select>
                                                </div>
                                            </div>

                                            <div className="bg-slate-950 p-3 rounded-xl border border-slate-800/80 text-xs space-y-2">
                                                <p className="text-slate-300"><strong>Falla Reportada:</strong> {o.problemaReportado}</p>
                                                <div>
                                                    <label className="block text-slate-400 font-bold mb-1">Diagnóstico / Avance del Mecánico:</label>
                                                    <textarea 
                                                        value={o.diagnostico || ''} 
                                                        onChange={(e) => handleCambiarEstadoOrden(o.id, o.estado, e.target.value)}
                                                        placeholder="Escriba aquí sus observaciones técnicas..."
                                                        className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-brand-500"
                                                        rows="2"
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </main>

                    {/* MODAL CREAR NUEVO PRODUCTO EN CATÁLOGO */}
                    {showNewProductModal && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-md w-full space-y-4">
                                <h3 className="text-lg font-bold text-white">✨ Registrar Nuevo Repuesto en Catálogo</h3>
                                <form onSubmit={handleCrearNuevoProducto} className="space-y-3">
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Nombre del Repuesto / Producto</label>
                                        <input 
                                            type="text" 
                                            value={nuevoProdNombre} 
                                            onChange={e => setNuevoProdNombre(e.target.value)}
                                            placeholder="Ej. Kit de Arrastre, Bujía C7HSA..."
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-brand-500" 
                                            required 
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs text-slate-400 mb-1">Marca</label>
                                            <input 
                                                type="text" 
                                                value={nuevoProdMarca} 
                                                onChange={e => setNuevoProdMarca(e.target.value)}
                                                placeholder="Ej. NGK, Honda..."
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-brand-500" 
                                                required 
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-slate-400 mb-1">Precio Venta (Q)</label>
                                            <input 
                                                type="number" 
                                                step="0.01"
                                                min="0"
                                                value={nuevoProdPrecio} 
                                                onChange={e => setNuevoProdPrecio(e.target.value)}
                                                placeholder="0.00"
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-brand-500" 
                                                required 
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs text-slate-400 mb-1">Stock Inicial</label>
                                            <input 
                                                type="number" 
                                                min="0"
                                                value={nuevoProdExistencia} 
                                                onChange={e => setNuevoProdExistencia(e.target.value)}
                                                placeholder="Unidades iniciales"
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-brand-500" 
                                                required 
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-slate-400 mb-1">Stock Mínimo (Alerta)</label>
                                            <input 
                                                type="number" 
                                                min="1"
                                                value={nuevoProdStockMin} 
                                                onChange={e => setNuevoProdStockMin(e.target.value)}
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-brand-500" 
                                                required 
                                            />
                                        </div>
                                    </div>

                                    <div className="flex gap-2 justify-end pt-3">
                                        <button type="button" onClick={() => setShowNewProductModal(false)} className="bg-slate-800 text-slate-300 text-xs px-4 py-2.5 rounded-xl font-bold">Cancelar</button>
                                        <button type="submit" className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-2.5 rounded-xl font-bold">Guardar Producto</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL REABASTECER STOCK */}
                    {showStockModal && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-md w-full space-y-4">
                                <h3 className="text-lg font-bold text-white">➕ Entrada de Stock / Reabastecimiento</h3>
                                <form onSubmit={handleAgregarStock} className="space-y-4">
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Repuesto a Ingresar</label>
                                        <select 
                                            value={selectedRepuestoId} 
                                            onChange={e => setSelectedRepuestoId(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white"
                                        >
                                            {repuestos.map(r => (
                                                <option key={r.id} value={r.id}>{r.nombreRepuesto} (Stock Actual: {r.existencia})</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Cantidad de Unidades a Sumar</label>
                                        <input 
                                            type="number" 
                                            min="1" 
                                            value={stockCantidad} 
                                            onChange={e => setStockCantidad(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white" 
                                            required 
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Nota / Proveedor / Descripción</label>
                                        <input 
                                            type="text" 
                                            value={stockNota} 
                                            onChange={e => setStockNota(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white" 
                                            required 
                                        />
                                    </div>

                                    <div className="flex gap-2 justify-end pt-2">
                                        <button type="button" onClick={() => setShowStockModal(false)} className="bg-slate-800 text-slate-300 text-xs px-4 py-2.5 rounded-xl font-bold">Cancelar</button>
                                        <button type="submit" className="bg-brand-500 hover:bg-brand-600 text-slate-950 text-xs px-4 py-2.5 rounded-xl font-bold">Guardar Entrada</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
